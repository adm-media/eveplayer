name: Storybook

# Builds the Storybook (every player option as a control, on public test
# streams) and publishes it to GitHub Pages.
#
# The Release workflow runs it after each release, from the new tag, so the
# published page shows the version that is on npm. Run it by hand (Actions ->
# Storybook -> Run workflow) to republish without a release: leave `ref` empty
# to build the branch the run is started from.
#
# One-time repo setup: Settings -> Pages -> "Build and deployment" -> Source:
# "GitHub Actions", and Custom domain: storybook.eveplayer.dev (served through
# a DNS CNAME record pointing at adm-media.github.io).

on:
  workflow_call:
    inputs:
      ref:
        description: "Tag or commit to build"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or commit to build (empty: the branch this run starts from)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The tags, to name the version the page shows.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # package.json on main keeps the version of the first release (a release
      # never commits back), so the version comes from the tags: `1.2.0` at a
      # release tag, `1.2.0-3-gabc1234` three commits past it.
      - name: Set the version
        run: |
          DESCRIBED="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if [ -n "$DESCRIBED" ]; then
            npm version "${DESCRIBED#v}" --no-git-tag-version --allow-same-version >/dev/null
          fi
          echo "Building Storybook for $(node -p "require('./package.json').version")"

      - name: Build Storybook
        run: yarn build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
